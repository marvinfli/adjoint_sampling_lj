# @package _global_
defaults:
  - override /noise_schedule: geometric
  - override /energy: lennardjones_energy
  - override /dataset: identical_particles_dataset
  - override /eval_dataset: identical_particles_eval
  - override /exploration: stepwise_noise  # Enable multiplicative exploration
  # - _self_
  # - override hydra/launcher: submitit_slurm
n_particles: 13
spatial_dim: 3 # space dimension
# Basic settings
seed: 0
device: cuda
learn_torsions: false
# Training parameters
num_batches_per_epoch: 500
# Sample generation settings
num_init_samples: 1024
num_samples_per_epoch: 1024
# Training duration settings
start_epoch: 0
num_epochs: 2_000
batch_size: 512
# Sampling settings
train_nfe: 500
eval_nfe: 500
num_eval_samples: 1024
# Optimizer settings
lr: 3e-4
lr_schedule: cosine
# Buffer settings
buffer_size: 20
# Energy cutoffs for valid conformers
min_energy: -80
max_energy: -10
# Visualization and evaluation settings
visualize_conformations: False
compute_coverage: False
# Energy model parameters
tau : 1
alpha : 0
# Score clipping parameters to prevent numerical instability
clip_scores: True
max_score_norm: 50.0
# Training stability parameters
grad_clip: 1e5
# Evaluation frequency
eval_freq: 50
# Input data settings
conformers_file: null
duplicates: 1
controller:
  _target_: adjoint_sampling.components.controllers.EGNN_dynamics
  n_layers: 5
  n_atoms: 100
  uniform: True
  hidden_nf: 128
  agg: "sum"
noise_schedule:
  _target_: adjoint_sampling.components.noise_schedule.GeometricNoiseSchedule
  sigma_min: 1e-3
  sigma_max: 3.0
# Exploration strategy configuration
exploration:
  _target_: adjoint_sampling.components.exploration.SomeStepwiseNoise
  start_multiplier: 2.0
  end_multiplier: 1.0
  decay_power: 1.0
  end_epoch: 1_000
  epoch_start_factor: 1.0
# custom
save_checkpoints: False
# ===== Distributed training settings =====
shared_dir: ${oc.env:PROJECTROOT}
amortized: True
# ===== Training strategy settings =====
pretrain_epochs: 0
# Loss function settings
scaled_BM_loss: True
BM_loss_weight: 0.0
BM_only_pretrain: False
use_AM_SDE: True
# SDE integration time discretization
discretization_scheme: uniform
# Ablation study parameters
no_pbase: False
# Learning rate warmup
warmup_period: 0
# Checkpoint loading
init_model: null
resume_checkpoint: False
# Where to save checkpoints
checkpoint_dir: None
use_wandb: True
wandb_project: adjoint_sampling
wandb_name: ${hydra:job.name}
config_name: ${hydra:job.config_name}
override_dirname: ${hydra:job.override_dirname}

